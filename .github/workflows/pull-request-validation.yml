name: Pull request validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  security:
    name: Required security gates
    uses: ./.github/workflows/security-gates.yml
    permissions:
      contents: read
      pull-requests: read

  terraform:
    name: Terraform formatting and validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the pull request
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Check Terraform formatting
        run: |
          terraform fmt -check -recursive infrastructure/environments/dev
          terraform fmt -check -recursive infrastructure/modules/github_actions_oidc
          terraform fmt -check -recursive infrastructure/modules/security_observability
          terraform fmt -check -recursive infrastructure/modules/eks_foundation

      - name: Initialize without the remote backend
        working-directory: infrastructure/environments/dev
        run: terraform init -backend=false

      - name: Validate Terraform configuration
        working-directory: infrastructure/environments/dev
        run: terraform validate

  application:
    name: Application tests and image build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the pull request
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install application dependencies
        working-directory: app
        run: python -m pip install --disable-pip-version-check --requirement requirements.txt

      - name: Run unit tests
        working-directory: app
        run: python -m unittest discover -s tests -v

      - name: Build the scan-compatible application image
        run: docker build --platform linux/amd64 --provenance=false --sbom=false --tag secure-aws-devsecops-app:ci ./app
